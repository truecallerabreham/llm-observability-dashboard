# ============================================================
# Alertmanager Configuration
# ============================================================
# Alertmanager receives alerts from Prometheus and routes
# them to notification channels (Slack, email, PagerDuty).

global:
  resolve_timeout: 5m

# --------------------------------------------------------
# Notification routing
# --------------------------------------------------------
# Routes tell Alertmanager WHERE to send alerts based on
# their labels (severity, team, etc.).
route:
  receiver: "slack-default"        # Default: send to Slack
  group_by: ["alertname", "severity"]
  group_wait: 30s                  # Wait 30s before sending (group related alerts)
  group_interval: 5m               # Wait 5m between groups
  repeat_interval: 4h              # Repeat every 4h if not resolved

  routes:
    # Critical alerts go to a separate Slack channel
    - match:
        severity: critical
      receiver: "slack-critical"
      group_wait: 10s              # Faster for critical issues

# --------------------------------------------------------
# Receivers — where alerts are sent
# --------------------------------------------------------
# Replace "YOUR_SLACK_WEBHOOK_URL" with your actual Slack
# incoming webhook URL. Create one at:
#   https://api.slack.com/messaging/webhooks
receivers:
  - name: "slack-default"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK}"
        channel: "#alerts-warning"
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'

  - name: "slack-critical"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK}"
        channel: "#alerts-critical"
        title: '🚨 {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
