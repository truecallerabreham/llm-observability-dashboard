# ============================================================
# OpenTelemetry Collector Configuration
# ============================================================
# The Collector has 3 stages:
#   1. Receivers: Accept traces from SDKs
#   2. Processors: Transform, sample, batch the data
#   3. Exporters: Send to storage backends (ClickHouse)
#
# Think of it as a pipeline:
#   SDK → Receiver → Processor → Exporter → ClickHouse

receivers:
  # --------------------------------------------------------
  # OTLP Receiver
  # --------------------------------------------------------
  # OTLP (OpenTelemetry Protocol) is the standard way to
  # send traces. All 6 SDKs we support (OpenAI, Anthropic,
  # Google GenAI, LangChain, LlamaIndex, vLLM) emit OTLP.
  #
  # We expose both HTTP (port 4318) and gRPC (port 4317).
  # HTTP is easier to debug; gRPC is faster for production.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # --------------------------------------------------------
  # Batch Processor
  # --------------------------------------------------------
  # Groups spans into bulk inserts before sending to ClickHouse.
  # Without this, each span is a separate INSERT — extremely slow.
  # With batching, we insert 5000+ spans per INSERT.
  #
  # Why 8192 bytes? ClickHouse recommends batch sizes of 8KB-1MB.
  # 8192 is a safe default that balances latency and throughput.
  batch:
    send_batch_size: 8192
    timeout: 5s

  # --------------------------------------------------------
  # Memory Limiter
  # --------------------------------------------------------
  # Prevents the Collector from OOM-killing under spike traffic.
  # When memory usage exceeds the limit, the Collector starts
  # rejecting incoming spans (backpressure) instead of crashing.
  #
  # 512MB limit is safe for most workloads. Increase if you
  # process >10,000 spans/second.
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # --------------------------------------------------------
  # Tail Sampling
  # --------------------------------------------------------
  # Keeps 100% of error traces (status = ERROR) and samples
  # 10% of successful traces. This gives us full visibility
  # into failures while reducing storage costs.
  #
  # Why tail-sampling? Head-sampling (deciding at SDK) can't
  # know if a trace will fail. Tail-sampling sees the complete
  # trace before deciding.
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    policies:
      # Always keep error traces
      - name: errors-policy
        type: status_code
        status_code: {status_codes: [ERROR]}
      # Sample 10% of successful traces
      - name: success-policy
        type: probabilistic
        probabilistic: {sampling_percentage: 10}

exporters:
  # --------------------------------------------------------
  # ClickHouse Exporter
  # --------------------------------------------------------
  # Sends processed spans to ClickHouse via HTTP interface.
  # The dataset maps to ClickHouse tables:
  #   traces → otel.traces
  #   metrics → otel.metrics
  #
  # We use HTTP (not native) because it's easier to debug
  # and doesn't require the native ClickHouse client library.
  clickhouse:
    endpoint: http://clickhouse:8123
    database: ${CLICKHOUSE_DB:-otel}
    username: ${CLICKHOUSE_USER:-admin}
    password: ${CLICKHOUSE_PASSWORD:-changeme}
    # create_schema: true creates the otel tables automatically
    # if they don't exist. This is a one-time operation.
    create_schema: true
    # flush_interval: how often to flush buffered data to ClickHouse
    flush_interval: 5s

  # --------------------------------------------------------
  # Debug Exporter (for development only)
  # --------------------------------------------------------
  # Prints spans to stdout. Useful for debugging but too
  # verbose for production. Only enable during development.
  debug:
    verbosity: basic

service:
  pipelines:
    # --------------------------------------------------------
    # Traces Pipeline
    # --------------------------------------------------------
    # Receives spans → batches them → sends to ClickHouse
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [clickhouse, debug]
